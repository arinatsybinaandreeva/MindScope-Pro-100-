
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Психологические тесты</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0B0B14;--card:#141424;--accent:#6366F1;--green:#10B981;--yellow:#F59E0B;--red:#EF4444;--text:#F1F5F9;--muted:#94A3B8;--radius:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:70px;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding:16px}
.screen{display:none;animation:fade .2s}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:1.5rem;margin-bottom:8px}
h2{font-size:1.2rem;margin-bottom:6px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid rgba(255,255,255,.06)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:none;border-radius:10px;font-weight:600;font-size:.9rem;cursor:pointer;width:100%;font-family:inherit;background:var(--accent);color:#fff;transition:.15s}
.btn-outline{background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--accent)}
.btn-sm{width:auto;padding:6px 12px;font-size:.8rem}
.tag{display:inline-block;padding:4px 10px;border-radius:20px;font-size:.7rem;font-weight:600}
.tag-green{background:rgba(16,185,129,.15);color:#34D399}
.tag-yellow{background:rgba(245,158,11,.15);color:#FBBF24}
.tag-red{background:rgba(239,68,68,.15);color:#F87171}
.tag-blue{background:rgba(99,102,241,.15);color:#818CF8}
.test-card{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:8px;cursor:pointer;border:1px solid transparent;transition:.2s}
.test-card:active{border-color:var(--accent)}
.emoji{font-size:2rem}
.progress-bar{height:4px;background:#2D2D4A;border-radius:4px;margin:12px 0;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);width:0%;transition:width .3s}
.chart-container{height:180px;margin:16px 0}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:rgba(11,11,20,.95);backdrop-filter:blur(20px);display:flex;justify-content:space-around;padding:8px;border-top:1px solid rgba(255,255,255,.05)}
.nav-item{background:none;border:none;color:var(--muted);font-size:.7rem;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit;cursor:pointer;padding:6px 12px;border-radius:12px}
.nav-item.active{color:#A78BFA;background:rgba(139,92,246,.1)}
.option-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:var(--text);padding:12px;border-radius:10px;font-size:.9rem;cursor:pointer;margin-bottom:6px;text-align:left;width:100%;font-family:inherit;line-height:1.4}
.option-btn:active{background:rgba(99,102,241,.2);border-color:var(--accent)}
.timeline-item{background:rgba(255,255,255,.03);padding:10px;border-radius:10px;margin-bottom:8px;font-size:.85rem}
.text-muted{color:var(--muted);font-size:.8rem}
.overdue-alert{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.qtext{font-size:1.05rem;margin:12px 0;line-height:1.55;word-wrap:break-word}
</style>
</head>
<body>
<div class="app">
  <div class="screen active" id="homeScreen">
    <h1>🧠 Психологические тесты</h1>
    <p class="text-muted" style="margin-bottom:12px;">Все тесты</p>
    <div id="overdueAlert"></div>
    <div id="testList"></div>
  </div>
  <div class="screen" id="testScreen">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
      <button class="btn btn-sm btn-outline" id="exitTestBtn">← Выйти</button>
      <span id="testTitle" style="font-weight:600;"></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div id="questionArea"></div>
    <button class="btn btn-sm btn-outline" id="prevBtn" style="margin-top:12px;display:none;">← Назад</button>
  </div>
  <div class="screen" id="profileScreen">
    <h1>📊 Психологический портрет</h1>
    <div id="profileContent"></div>
  </div>
  <div class="screen" id="historyScreen">
    <h1>📅 История и графики</h1>
    <div id="historyContent"></div>
  </div>
  <nav class="bottom-nav">
    <button class="nav-item active" data-screen="home">📋<span>Тесты</span></button>
    <button class="nav-item" data-screen="profile">📊<span>Портрет</span></button>
    <button class="nav-item" data-screen="history">📅<span>История</span></button>
  </nav>
</div>

<script>
// ============================================================
// ГЛОБАЛЬНЫЙ МАССИВ ТЕСТОВ. КАЖДАЯ ЧАСТЬ ДОБАВЛЯЕТ ТЕСТЫ ЧЕРЕЗ TESTS.push(...)
// ============================================================
window.TESTS = window.TESTS || [];

// ============================================================
// ЛОГИКА ПРИЛОЖЕНИЯ (НЕ ТРОГАТЬ)
// ============================================================
(function(){
const TESTS = window.TESTS;

let currentScreen='home';
let currentTest=null;
let currentQuestion=0;
let answers={};
let results=JSON.parse(localStorage.getItem('mindscope_results')||'{}');
let history=JSON.parse(localStorage.getItem('mindscope_history')||'[]');

function saveData(){
  localStorage.setItem('mindscope_results',JSON.stringify(results));
  localStorage.setItem('mindscope_history',JSON.stringify(history));
}

function navigateTo(screen){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(screen+'Screen').classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelector(`.nav-item[data-screen="${screen}"]`)?.classList.add('active');
  currentScreen=screen;
  if(screen==='home') renderHome();
  else if(screen==='profile') renderProfile();
  else if(screen==='history') renderHistory();
  window.scrollTo(0,0);
}

function isOverdue(test){
  const last=results[test.id];
  if(!last) return true;
  const days=Math.floor((Date.now()-new Date(last.date))/(1000*60*60*24));
  return days>=test.freqDays;
}

function renderHome(){
  const overdue=TESTS.filter(t=>isOverdue(t));
  document.getElementById('overdueAlert').innerHTML = overdue.length
    ? `<div class="overdue-alert">⚠️ ${overdue.length} тестов требуют обновления</div>` : '';
  let html='';
  TESTS.forEach(test=>{
    const last=results[test.id];
    const lastDate=last?new Date(last.date).toLocaleDateString('ru-RU'):null;
    const overdueTest=isOverdue(test);
    html+=`
      <div class="test-card" onclick="startTest('${test.id}')">
        <div class="emoji">${test.emoji}</div>
        <div style="flex:1; word-wrap:break-word;">
          <div style="font-weight:600;">${test.name}</div>
          <div class="text-muted">${test.desc}</div>
          <div style="margin-top:6px;">
            ${lastDate?`<span class="tag ${overdueTest?'tag-red':'tag-green'}">${overdueTest?'⏰ Просрочен':'✅ '+lastDate}</span>`:'<span class="tag tag-blue">Новый</span>'}
            <span class="text-muted" style="margin-left:6px;">△ ${test.freqDays} дн.</span>
          </div>
        </div>
      </div>`;
  });
  document.getElementById('testList').innerHTML=html;
}

window.startTest=function(id){
  currentTest=TESTS.find(t=>t.id===id);
  if(!currentTest) return;
  currentQuestion=0;
  answers={};
  document.getElementById('testTitle').textContent=currentTest.name;
  navigateTo('test');
  renderQuestion();
};

function renderQuestion(){
  const test=currentTest;
  const q=test.questions[currentQuestion];
  document.getElementById('progressFill').style.width=((currentQuestion/test.questions.length)*100)+'%';
  document.getElementById('prevBtn').style.display=currentQuestion>0?'inline-flex':'none';
  let html=`<div class="card"><p class="text-muted">Вопрос ${currentQuestion+1}/${test.questions.length}</p>
    <p class="qtext">${q.text}</p>`;
  if(test.type==='yn'){
    html+=`<button class="btn btn-outline" style="margin-bottom:8px;" onclick="answerQuestion(true)">Да</button>`;
    html+=`<button class="btn btn-outline" onclick="answerQuestion(false)">Нет</button>`;
  } else {
    test.scale.forEach((label,idx)=>{
      html+=`<button class="option-btn" onclick="answerQuestion(${idx})">${label}</button>`;
    });
  }
  html+=`</div>`;
  document.getElementById('questionArea').innerHTML=html;
}

window.answerQuestion=function(value){
  answers[currentQuestion]=value;
  currentQuestion++;
  if(currentQuestion>=currentTest.questions.length) finishTest();
  else renderQuestion();
};

function finishTest(){
  const test=currentTest;
  let scores={};
  test.questions.forEach((q,idx)=>{
    const trait=q.trait||'total';
    if(!scores[trait]) scores[trait]=0;
    let val=answers[idx];
    if(test.type==='yn'){
      let num = val===true ? 1 : 0;
      if(q.reverse) num = 1-num;
      scores[trait]+=num;
    } else {
      let num = val;
      if(q.reverse) num = (test.scale.length-1) - num;
      scores[trait]+=num;
    }
  });
  const result={testId:test.id,testName:test.name,scores,date:new Date().toISOString()};
  results[test.id]=result;
  history.unshift(result);
  if(history.length>500) history.length=500;
  saveData();

  const hasTraits=test.questions.some(q=>q.trait&&q.trait!=='total');
  const interpInput=(test.type==='yn'||hasTraits)?scores:(scores.total||0);
  const interpretation=test.interpret(interpInput);

  let html='<div class="card"><h2>✅ Результат</h2>';
  interpretation.forEach(item=>{
    html+=`
      <div style="margin:12px 0; padding:12px; background:rgba(255,255,255,.03); border-radius:12px;">
        <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px;">
          <strong>${item.name}</strong>
          ${item.max>0?`<span class="tag tag-${item.color}">${item.value} / ${item.max}</span>`:''}
        </div>
        <p style="font-size:.9rem; margin-top:6px; word-wrap:break-word;">${item.desc}</p>
      </div>`;
  });
  html+=`<button class="btn btn-primary" onclick="navigateTo('profile')" style="margin-top:10px;">📊 К портрету</button>`;
  html+=`<button class="btn btn-outline" onclick="navigateTo('home')" style="margin-top:6px;">📋 К тестам</button></div>`;
  document.getElementById('questionArea').innerHTML=html;
}

function renderProfile(){
  const done=Object.values(results);
  if(!done.length){
    document.getElementById('profileContent').innerHTML='<p class="text-muted">Пройдите тесты для построения портрета.</p>';
    return;
  }
  let green=[],yellow=[],red=[];
  done.forEach(r=>{
    const test=TESTS.find(t=>t.id===r.testId);
    if(!test) return;
    const hasTraits=test.questions.some(q=>q.trait&&q.trait!=='total');
    const interpInput=(test.type==='yn'||hasTraits)?r.scores:(r.scores.total||0);
    const interp=test.interpret(interpInput);
    interp.forEach(i=>{
      const entry={...i,testName:test.name};
      if(i.color==='green') green.push(entry);
      else if(i.color==='yellow') yellow.push(entry);
      else red.push(entry);
    });
  });
  document.getElementById('profileContent').innerHTML=`
    <div class="card"><h3>🟢 Сильные стороны (${green.length})</h3>${green.map(i=>`<p style="margin:6px 0;">${i.testName} — <b>${i.name}</b>: ${i.desc}</p>`).join('')||'<p class="text-muted">Нет</p>'}</div>
    <div class="card"><h3>🟡 Зоны внимания (${yellow.length})</h3>${yellow.map(i=>`<p style="margin:6px 0;">${i.testName} — <b>${i.name}</b>: ${i.desc}</p>`).join('')||'<p class="text-muted">Нет</p>'}</div>
    <div class="card"><h3>🔴 Требует проработки (${red.length})</h3>${red.map(i=>`<p style="margin:6px 0;">${i.testName} — <b>${i.name}</b>: ${i.desc}</p>`).join('')||'<p class="text-muted">Нет</p>'}${red.length?'<p style="color:#F87171;font-size:.8rem;margin-top:8px;">⚠️ Рекомендована консультация психолога</p>':''}</div>
  `;
}

function renderHistory(){
  if(!history.length){
    document.getElementById('historyContent').innerHTML='<p class="text-muted">История пуста.</p>';
    return;
  }
  const grouped={};
  history.forEach(h=>{
    if(!grouped[h.testId]) grouped[h.testId]=[];
    grouped[h.testId].push(h);
  });
  let html='<div class="card"><h3>📈 Динамика по тестам</h3>';
  Object.entries(grouped).forEach(([tid,items])=>{
    if(items.length<2) return;
    const test=TESTS.find(t=>t.id===tid);
    if(!test) return;
    html+=`<p style="margin:10px 0 4px;">${test.emoji} ${test.name}</p><div class="chart-container"><canvas id="chart-${tid}"></canvas></div>`;
  });
  html+='</div><div class="card"><h3>🕐 Хронология</h3>';
  history.slice(0,30).forEach(h=>{
    const test=TESTS.find(t=>t.id===h.testId);
    if(!test) return;
    const hasTraits=test.questions.some(q=>q.trait&&q.trait!=='total');
    const interpInput=(test.type==='yn'||hasTraits)?h.scores:(h.scores.total||0);
    const interp=test.interpret(interpInput);
    html+=`<div class="timeline-item">
      <div class="text-muted">📅 ${new Date(h.date).toLocaleString('ru-RU')}</div>
      <strong>${h.testName}</strong>
      <div style="margin-top:4px;">${interp.map(i=>`<span class="tag tag-${i.color}" style="margin-right:4px;margin-bottom:4px;">${i.name}: ${i.max>0?i.value+'/'+i.max:i.color==='green'?'✓':'!'}</span>`).join('')}</div>
    </div>`;
  });
  html+='</div>';
  document.getElementById('historyContent').innerHTML=html;

  setTimeout(()=>{
    Object.entries(grouped).forEach(([tid,items])=>{
      if(items.length<2) return;
      const canvas=document.getElementById('chart-'+tid);
      if(!canvas) return;
      const sorted=[...items].sort((a,b)=>new Date(a.date)-new Date(b.date));
      const key=Object.keys(sorted[0].scores)[0]||'total';
      new Chart(canvas,{
        type:'line',
        data:{
          labels:sorted.map(i=>new Date(i.date).toLocaleDateString('ru-RU')),
          datasets:[{data:sorted.map(i=>i.scores[key]||0),borderColor:'#818CF8',backgroundColor:'rgba(129,140,248,.1)',fill:true,tension:.4,pointRadius:3}]
        },
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}
      });
    });
  },100);
}

document.querySelectorAll('.nav-item').forEach(btn=>{
  btn.addEventListener('click',()=>navigateTo(btn.dataset.screen));
});
document.getElementById('exitTestBtn').addEventListener('click',()=>navigateTo('home'));
document.getElementById('prevBtn').addEventListener('click',()=>{
  if(currentQuestion>0){
    currentQuestion--;
    delete answers[currentQuestion];
    renderQuestion();
  }
});

renderHome();
window.navigateTo=navigateTo;
})();
</script>

<!-- ============================================================
     ЗДЕСЬ БУДУТ ВСТАВЛЯТЬСЯ ЧАСТИ С ТЕСТАМИ.
     Каждая часть — это отдельный <script>, который добавляет тесты.
     Копируйте их ПО ОЧЕРЕДИ В КОНЕЦ ФАЙЛА, ПЕРЕД </body>
     ============================================================ -->
<script>
TESTS.push(
{
  id:'iri', cat:'Отношения', emoji:'💝',
  name:'Индекс эмпатии (IRI, Дэвис)',
  freqDays:180,
  desc:'Когнитивная и эмоциональная эмпатия',
  type:'likert',
  scale:['Совершенно не согласен','Скорее не согласен','Затрудняюсь ответить','Скорее согласен','Полностью согласен'],
  questions:[
    {text:'Я часто представляю себе, как бы я чувствовал себя на месте другого человека, когда с ним происходит что-то важное.', trait:'FS'},
    {text:'Обычно я искренне сочувствую людям, у которых случилась беда, даже если они мне незнакомы.', trait:'EC'},
    {text:'Иногда мне бывает трудно посмотреть на ситуацию с точки зрения другого человека, если я уверен в своей правоте.', trait:'PT', reverse:true},
    {text:'Когда я вижу, что кого-то несправедливо обижают, я чувствую жалость и желание защитить.', trait:'EC'},
    {text:'Я способен понять чувства другого человека, даже если я не согласен с его действиями.', trait:'PT'},
    {text:'Меня часто трогают истории других людей — даже те, которые я вижу в новостях или читаю в книгах.', trait:'EC'},
    {text:'Мне легко представить себя на месте персонажа фильма или книги и переживать его эмоции.', trait:'FS'},
    {text:'Мне трудно оставаться равнодушным, когда кто-то рядом со мной плачет или переживает.', trait:'EC'},
    {text:'В споре я стараюсь понять точку зрения другого, а не только доказать свою правоту.', trait:'PT'},
    {text:'Я искренне сопереживаю, когда близкий человек сталкивается с трудностями, даже если я не могу помочь.', trait:'EC'}
  ],
  interpret:(s)=>{
    const fs=s.FS||0, ec=s.EC||0, pt=s.PT||0, total=fs+ec+pt;
    return [
      {name:'Фантазия (FS)', value:fs, max:20, color: fs>=14?'green':fs>=8?'yellow':'yellow',
       desc: fs>=14?'Высокая — вы легко представляете себя на месте других, хорошо понимаете чужие переживания через воображение.':fs>=8?'Средняя — вы можете представить себя на месте другого, но не всегда.':'Низкая — вам трудно представить чувства других через воображение.'},
      {name:'Эмпатическая забота (EC)', value:ec, max:30, color: ec>=22?'green':ec>=12?'yellow':'red',
       desc: ec>=22?'Высокая — вы искренне сопереживаете другим, вам свойственна эмоциональная отзывчивость и желание помочь.':ec>=12?'Средняя — вы сопереживаете, но иногда держите дистанцию.':'Низкая — вам может быть трудно эмоционально откликаться на переживания других.'},
      {name:'Принятие перспективы (PT)', value:pt, max:20, color: pt>=14?'green':pt>=8?'yellow':'yellow',
       desc: pt>=14?'Высокое — вы хорошо понимаете точку зрения других людей, даже когда не согласны с ними.':pt>=8?'Среднее — вы иногда встаёте на позицию другого, но не всегда.':'Низкое — вам может быть сложно увидеть ситуацию глазами другого.'},
      {name:'Общая эмпатия', value:total, max:70, color: total>=50?'green':total>=30?'yellow':'red',
       desc: total>=50?'Высокая — вы высокоэмпатичный человек. Это ценнейший ресурс в общении, работе и отношениях.':total>=30?'Средний уровень эмпатии — вы способны к сопереживанию, но иногда сдерживаете эмоции.':'Низкая эмпатия — вам стоит развивать навык активного слушания и интереса к чувствам других.'}
    ];
  }
},
{
  id:'rosenberg', cat:'Личность', emoji:'🪞',
  name:'Шкала самооценки Розенберга',
  freqDays:30,
  desc:'Общий уровень самоуважения и самопринятия',
  type:'likert',
  scale:['Полностью не согласен','Скорее не согласен','Скорее согласен','Полностью согласен'],
  questions:[
    {text:'В целом я считаю себя достойным человеком, по крайней мере не хуже других людей.', trait:'total'},
    {text:'Я чувствую, что у меня есть целый ряд хороших качеств и достоинств.', trait:'total'},
    {text:'В целом я склонен считать себя неудачником и разочарованием для окружающих.', trait:'total', reverse:true},
    {text:'Я способен делать многие вещи так же хорошо, как и большинство других людей.', trait:'total'},
    {text:'Мне кажется, что мне особенно нечем гордиться в жизни.', trait:'total', reverse:true},
    {text:'Я отношусь к себе положительно и с уважением, принимаю себя.', trait:'total'},
    {text:'В целом я доволен собой как личностью и своим поведением.', trait:'total'},
    {text:'Мне бы очень хотелось больше уважать себя и ценить свои достижения.', trait:'total', reverse:true}
  ],
  interpret:(total)=>{
    return [{name:'Самооценка', value:total, max:32, color: total>=24?'green':total>=16?'yellow':'red',
      desc: total>=24?'Высокая самооценка — вы принимаете себя, уверены в своих силах, спокойно относитесь к недостаткам.':total>=16?'Средняя самооценка — есть зоны, где вы сомневаетесь в себе, но в целом отношение к себе положительное.':'Низкая самооценка — вы часто себя критикуете и недооцениваете. Рекомендуется работа с психологом.'}];
  }
},
{
  id:'ucla', cat:'Отношения', emoji:'🏝️',
