            T({ id: 't103', name: 'Экранное время', emoji: '📱', cat: 'Поведение', desc: 'Зависимость от гаджетов', freq: '1 мес', fd: 30, type: 'l5', ll: ['1', '2', '3', '4', '5'], q: [{ t: '>4 часов в телефоне' }, { t: 'Соцсети после пробуждения' }, { t: 'Трудно отложить' }, { t: 'Тревога без' }, { t: 'Мешает сну' }, { t: 'Отвлекаюсь' }, ], intr: (t) => [{ sc: 'Экран', v: t, m: 30, tx: t >= 22 ? 'Зависимость' : t >= 14 ? 'Умеренная' : 'Низкая', zn: t >= 22 ? 'r' : t >= 14 ? 'y' : 'g', dt: 'Зависимость от гаджетов.' }] }),
            T({ id: 't104', name: 'Трудоголизм DUWAS', emoji: '💼', cat: 'Поведение', desc: 'Навязчивая работа', freq: '3 мес', fd: 90, type: 'l5', ll: ['1', '2', '3', '4', '5'], q: [{ t: 'Работаю больше ожидаемого' }, { t: 'Вина без работы' }, { t: 'Работа — главное' }, { t: 'Не расслабляюсь' }, { t: 'Близкие жалуются' }, { t: 'Работа на отдыхе' }, ], intr: (t) => [{ sc: 'Трудоголизм', v: t, m: 30, tx: t >= 22 ? 'Выраженный' : t >= 14 ? 'Умеренный' : 'Низкий', zn: t >= 22 ? 'r' : t >= 14 ? 'y' : 'g', dt: 'Риск выгорания.' }] }),
            T({ id: 't105', name: 'Склонность к риску DOSPERT', emoji: '🎲', cat: 'Поведение', desc: 'Готовность рисковать', freq: '6 мес', fd: 180, type: 'l5', ll: ['1', '2', '3', '4', '5'], q: [{ t: 'Рискованные инвестиции' }, { t: 'Экстрим' }, { t: 'Конфликт за принципы' }, { t: 'Быстрые решения' }, { t: 'Риск оправдан' }, { t: 'Не боюсь неопределённости' }, ], intr: (t) => [{ sc: 'Риск', v: t, m: 30, tx: t >= 22 ? 'Высокий' : 'Низкий', zn: 'g', dt: 'Готовность идти на риск.' }] }),
            T({ id: 't106', name: 'Управление временем', emoji: '⏳', cat: 'Поведение', desc: 'Продуктивность', freq: '1 мес', fd: 30, type: 'l5', ll: ['1', '2', '3', '4', '5'], q: [{ t: 'Планирую день' }, { t: 'Не трачу впустую' }, { t: 'Успеваю' }, { t: 'Расставляю приоритеты' }, { t: 'Соблюдаю сроки' }, { t: 'Баланс' }, ], intr: (t) => [{ sc: 'Время', v: t, m: 30, tx: t >= 22 ? 'Отличное' : t >= 14 ? 'Среднее' : 'Слабое', zn: t >= 22 ? 'g' : t >= 14 ? 'y' : 'r', dt: 'Эффективность использования времени.' }] }),
            T({ id: 't107', name: 'Физическая активность', emoji: '🏃', cat: 'Поведение', desc: 'Уровень активности', freq: '1 мес', fd: 30, type: 'l5', ll: ['1', '2', '3', '4', '5'], q: [{ t: '3 раза в неделю' }, { t: 'Хожу пешком' }, { t: 'Бодрость после' }, { t: 'Не сидячий' }, { t: 'Движение каждый день' }, { t: 'Часть рутины' }, ], intr: (t) => [{ sc: 'Активность', v: t, m: 30, tx: t >= 22 ? 'Высокая' : t >= 14 ? 'Умеренная' : 'Низкая', zn: t >= 22 ? 'g' : t >= 14 ? 'y' : 'r', dt: 'Уровень физической активности.' }] }),
            T({ id: 't108', name: 'Пищевые привычки', emoji: '🥗', cat: 'Поведение', desc: 'Здоровое питание', freq: '1 мес', fd: 30, type: 'l5', ll: ['1', '2', '3', '4', '5'], q: [{ t: 'Овощи и фрукты' }, { t: 'Избегаю фастфуд' }, { t: 'Не переедаю' }, { t: 'Достаточно воды' }, { t: 'Не пропускаю приёмы' }, { t: 'Осознанный выбор' }, ], intr: (t) => [{ sc: 'Питание', v: t, m: 30, tx: t >= 22 ? 'Здоровое' : t >= 14 ? 'Среднее' : 'Нездоровое', zn: t >= 22 ? 'g' : t >= 14 ? 'y' : 'r', dt: 'Качество питания.' }] }),
        ];
        console.log('Всего тестов загружено:', ALL_TESTS.length);
        // ============ ЛОГИКА ПРИЛОЖЕНИЯ ============
        let curScr = 'home',
            curTest = null,
            qIdx = 0,
            gIdx = 0,
            ans = {},
            filt = 'all';
        let results = JSON.parse(localStorage.getItem('ms_res') || '{}');
        let hist = JSON.parse(localStorage.getItem('ms_hist') || '[]');

        function save() { localStorage.setItem('ms_res', JSON.stringify(results));
            localStorage.setItem('ms_hist', JSON.stringify(hist)); }

        function resetAll() {
            if (confirm('Вы уверены, что хотите начать заново? Весь прогресс будет удалён.')) {
                localStorage.removeItem('ms_res');
                localStorage.removeItem('ms_hist');
                results = {};
                hist = [];
                navTo('home');
                renderFilters();
                renderTests();
                renderOverdue();
            }
        }

        function navTo(s) {
            curScr = s;
            document.querySelectorAll('.screen').forEach(x => x.classList.remove('active'));
            document.getElementById(s + 'Screen').classList.add('active');
            document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
            document.querySelector(`.nav-item[data-screen="${s}"]`).classList.add('active');
            if (s === 'home') { renderFilters();
                renderTests();
                renderOverdue(); }
            if (s === 'profile') renderProfile();
            if (s === 'history') renderHistory();
            window.scrollTo(0, 0);
        }

        function navScr(n) { document.querySelectorAll('.screen').forEach(x => x.classList.remove('active'));
            document.getElementById(n + 'Screen').classList.add('active');
            window.scrollTo(0, 0); }

        function getCats() { return ['all', ...new Set(ALL_TESTS.map(t => t.cat))]; }

        function renderFilters() { document.getElementById('filterTabs').innerHTML = getCats().map(c =>
                `<button class="filter-tab ${filt===c?'active':''}" onclick="filt='${c}';renderFilters();renderTests();">${c==='all'?'Все':c}</button>`
                ).join(''); }

        function getOverdue() { return ALL_TESTS.filter(t => { let l = results[t.id]; if (!l || !l.date) return true; return Math
                    .floor((Date.now() - new Date(l.date)) / 86400000) >= t.fd; }); }

        function renderOverdue() { let o = getOverdue();
            document.getElementById('overdueAlert').innerHTML = o.length ? `<div class="overdue-alert">⚠️ ${o.length} тестов пора обновить</div>` :
                ''; }

        function renderTests() {
            let f = filt === 'all' ? ALL_TESTS : ALL_TESTS.filter(t => t.cat === filt);
            let h = '',
                lc = '';
            f.forEach(t => {
                if (filt === 'all' && t.cat !== lc) { h += `<div class="category-header">${t.cat}</div>`;
                    lc = t.cat; }
                let l = results[t.id],
                    ld = l && l.date ? new Date(l.date).toLocaleDateString('ru-RU') : '',
                    ds = l && l.date ? Math.floor((Date.now() - new Date(l.date)) / 86400000) : 99999,
                    ov = l && ds >= t.fd,
                    nv = !l;
                h += `<div class="test-card${ov?' overdue':''}" onclick="startTest('${t.id}')"><div class="test-emoji">${t.emoji}</div><div class="test-info"><div class="test-name">${t.name}</div><div class="test-desc">${t.desc}</div><div class="test-meta"><span class="freq-badge">${t.freq}</span>${nv?'<span class="tag tag-i">Новый</span>':ov?'<span class="tag tag-overdue">⏰ Просрочен!</span>':'<span class="tag tag-s">✅ '+ld+'</span>'}</div></div></div>`;
            });
            document.getElementById('testList').innerHTML = h;
        }

        function startTest(id) { curTest = ALL_TESTS.find(t => t.id === id); if (!curTest) return;
            qIdx = 0;
            gIdx = 0;
            ans = {};
            document.getElementById('testScreenTitle').textContent = curTest.name;
            document.getElementById('prevBtn').style.display = 'none';
            navScr('test');
            renderQ(); }

        function renderQ() {
            let t = curTest,
                a = document.getElementById('testQuestionArea'),
                p = document.getElementById('testProgress'),
                b = document.getElementById('prevBtn');
            let tot = t.type === 'ch' ? t.g.length : t.q.length,
                idx = t.type === 'ch' ? gIdx : qIdx;
            p.style.width = ((idx / tot) * 100) + '%';
            b.style.display = idx > 0 ? 'inline-flex' : 'none';
            if (t.type === 'yn') { let q = t.q[qIdx];
                a.innerHTML =
                    `<div class="card"><p class="text-xs">Вопрос ${qIdx+1}/${tot}</p><p style="font-size:15px;margin:10px 0;">${q.t}</p><div style="display:flex;gap:10px;"><button class="btn btn-outline" id="btnY">✅ Да</button><button class="btn btn-outline" id="btnN">❌ Нет</button></div></div>`;
                document.getElementById('btnY').onclick = () => ansYN(true);
                document.getElementById('btnN').onclick = () => ansYN(false); } else if (t.type === 'ch') { let g = t.g[
                    gIdx];
                a.innerHTML =
                    `<div class="card"><p class="text-xs">${g.ti} (${gIdx+1}/${tot})</p>${g.o.map((o,i)=>`<button class="option-btn" data-idx="${i}">${o}</button>`).join('')}</div>`;
                document.querySelectorAll('.option-btn').forEach(btn => btn.onclick = function() { ansCh(parseInt(this
                        .dataset.idx)); }); } else { let q = t.q[qIdx],
                    l = t.ll;
                a.innerHTML =
                    `<div class="card"><p class="text-xs">Вопрос ${qIdx+1}/${tot}</p><p style="font-size:15px;margin:8px 0;">${q.t}</p><div style="display:flex;flex-wrap:wrap;gap:5px;">${l.map((lb,i)=>`<button class="btn btn-sm btn-outline" style="flex:1;min-width:36px;" data-val="${i+1}">${lb}</button>`).join('')}</div></div>`;
                document.querySelectorAll('[data-val]').forEach(btn => btn.onclick = function() { ansL(parseInt(this
                        .dataset.val)); }); }
        }

        function ansYN(v) { ans[curTest.q[qIdx].id || qIdx] = v;
            advance(); }

        function ansCh(i) { ans['g_' + (curTest.g[gIdx].id || gIdx)] = i;
            gIdx++; if (gIdx >= curTest.g.length) finish();
            else renderQ(); }

        function ansL(v) { ans[curTest.q[qIdx].id || qIdx] = v;
            advance(); }

        function advance() { qIdx++; if (qIdx >= curTest.q.length) finish();
            else renderQ(); }

        function prevQuestion() { if (curTest.type === 'ch') { if (gIdx > 0) { gIdx--; delete ans['g_' + (curTest.g[gIdx]
                    .id || gIdx)]; } } else { if (qIdx > 0) { qIdx--; delete ans[curTest.q[qIdx].id || qIdx]; } }
            renderQ(); }

        function finish() {
            let t = curTest,
                sc = {},
                tot = 0;
            if (t.type === 'yn') t.q.forEach(q => { if (!sc[q.s]) sc[q.s] = 0;
                sc[q.s] += (ans[q.id || qIdx] === true ? 1 : 0) * (q.r ? -1 : 1); });
            else if (t.type === 'ch') t.g.forEach(g => tot += ans['g_' + (g.id || gIdx)] || 0);
            else if (t.sc) t.q.forEach(q => { if (!sc[q.s]) sc[q.s] = 0;
                sc[q.s] += (ans[q.id || qIdx] || 1) * (q.r ? -1 : 1); });
            else t.q.forEach(q => tot += ans[q.id || qIdx] || 1);
            if (t.type === 'ch') sc = { total: tot };
            if (!t.sc && t.type !== 'yn' && t.type !== 'ch') sc = { total: tot };
            let rd = { testId: t.id, testName: t.name, scores: sc, date: new Date().toISOString() };
            results[t.id] = rd;
            hist.unshift(rd); if (hist.length > 2000) hist = hist.slice(0, 2000);
            save();
            showResult(sc);
        }

        function showResult(sc) {
            let t = curTest,
                interp = (t.type === 'ch' || !t.sc) ? t.intr(sc.total || Object.values(sc)[0]) : t.intr(sc);
            document.getElementById('testProgress').style.width = '100%';
            document.getElementById('prevBtn').style.display = 'none';
            let h = '<div class="card card-accent"><h3>✅ Тест завершён</h3>';
            interp.forEach(item => h +=
                `<div style="margin:8px 0;padding:10px;background:rgba(255,255,255,0.02);border-radius:10px;"><div style="display:flex;justify-content:space-between;"><strong>${item.sc}</strong><span class="tag ${item.zn==='r'?'tag-d':item.zn==='y'?'tag-w':'tag-s'}">${item.tx}</span></div>${item.m>0?`<div class="text-xs">${item.v} из ${item.m}</div>`:''}<div class="detail-block">${item.dt||''}</div></div>`
                );
            h +=
            '<button class="btn btn-primary" id="btnP" style="margin-top:10px;">📊 Психологический портрет</button><button class="btn btn-outline" id="btnB" style="margin-top:6px;">📋 К тестам</button>';
            document.getElementById('testQuestionArea').innerHTML = h;
            document.getElementById('btnP').onclick = () => navTo('profile');
            document.getElementById('btnB').onclick = () => navTo('home');
        }

        function renderProfile() {
            let c = document.getElementById('profileContent'),
                done = Object.values(results).filter(r => r && r.testId);
            if (!done.length) { c.innerHTML =
                    '<div class="card" style="text-align:center;padding:30px;">Пройдите тесты для построения портрета</div>'; return; }
            let gZ = [],
                yZ = [],
                rZ = [];
            done.forEach(rt => { let t = ALL_TESTS.find(t => t.id === rt.testId); if (!t) return; let interp = (t.type ===
                    'ch' || !t.sc) ? t.intr(rt.scores.total || Object.values(rt.scores)[0]) : t.intr(rt.scores);
                interp.forEach(item => { let e = { tn: t.name, em: t.emoji, ...item }; if (item.zn === 'g') gZ.push(
                        e); else if (item.zn === 'y') yZ.push(e);
                    else rZ.push(e); }); });
            let h = '';
            h +=
                `<div class="portrait-block"><h2>🧠 Психологический портрет</h2><p style="font-size:13px;line-height:1.7;margin:10px 0;">${genPortrait(gZ,yZ,rZ)}</p><p class="text-xs">Пройдено: ${done.length} из ${ALL_TESTS.length}</p></div>`;
            h +=
            '<div class="card"><h3>📊 Радар профиля</h3><div class="chart-wrap"><canvas id="radarChart"></canvas></div></div>';
            h +=
                `<div class="card card-green"><h3>🟢 Сильные стороны (${gZ.length})</h3>${gZ.map(z=>`<div style="padding:4px 0;">${z.em} ${z.sc} — ${z.tx}</div>`).join('')||'Нет'}</div>`;
            h +=
                `<div class="card card-yellow"><h3>🟡 Зоны риска (${yZ.length})</h3>${yZ.map(z=>`<div style="padding:4px 0;">${z.em} ${z.sc} — ${z.tx}</div>`).join('')||'Нет'}</div>`;
            h +=
                `<div class="card card-red"><h3>🔴 Проблемные места (${rZ.length})</h3>${rZ.map(z=>`<div style="padding:4px 0;">${z.em} ${z.sc} — ${z.tx}</div>`).join('')||'Нет'}${rZ.length?'<p style="color:var(--red);font-size:11px;">⚠️ Рекомендована консультация психолога</p>':''}</div>`;
            c.innerHTML = h;
            setTimeout(() => { let ctx = document.getElementById('radarChart'); if (!ctx) return;
                new Chart(ctx, { type: 'radar', data: buildRadar(), options: { responsive: true,
                        scales: { r: { min: 0, max: 100, ticks: { stepSize: 20, color: '#64748B' },
                                grid: { color: 'rgba(255,255,255,0.05)' } } }, plugins: { legend: { display: false } } }
                    }); }, 300);
        }

        function genPortrait(g, y, r) { return (r.length ? '🔴 Проблемы: ' + r.map(z => z.sc).join(', ') + '. ' : '') + (y
                .length ? '🟡 Риски: ' + y.map(z => z.sc).join(', ') + '. ' : '') + (g.length ? '🟢 Сильные: ' + g.map(z =>
                    z.sc).join(', ') + '.' : 'Пройдите больше тестов.'); }

        function buildRadar() { let l = [],
                d = [];
            ALL_TESTS.forEach(t => { let res = results[t.id]; if (!res) return; let interp = (t.type === 'ch' || !t.sc) ? t
                    .intr(res.scores.total || Object.values(res.scores)[0]) : t.intr(res.scores);
                interp.forEach(item => { if (item.m > 0 && d.length < 18) { l.push(item.sc); let pct = Math.round((item
                            .v / item.m) * 100); if (['Нейротизм', 'Депрессия', 'Тревога', 'Подавление',
                            'Одиночество', 'Перфекционизм', 'Прокрастинация', 'Выгорание', 'Стресс', 'Руминация',
                            'Катастрофизация', 'Гнев', 'Импульсивность'
                        ].includes(item.sc)) pct = 100 - pct;
                        d.push(Math.min(100, Math.max(0, pct))); } }); }); if (!l.length) { l = ['Нет данных'];
                d = [0]; } return { labels: l, datasets: [{ data: d, backgroundColor: 'rgba(99,102,241,0.1)',
                    borderColor: '#6366F1', borderWidth: 2 }] }; }

        function renderHistory() {
            let c = document.getElementById('historyContent');
            if (!hist.length) { c.innerHTML =
                    '<div class="card" style="text-align:center;padding:30px;">История пуста</div>'; return; }
            let grp = {};
            hist.forEach(h => { if (!grp[h.testId]) grp[h.testId] = [];
                grp[h.testId].push(h); });
            let h = '<div class="card"><h3>📈 Графики динамики</h3>';
            Object.entries(grp).forEach(([tid, items]) => { if (items.length < 2) return; let t = ALL_TESTS.find(t => t
                    .id === tid); if (!t) return;
                h +=
                    `<p style="font-size:12px;margin:8px 0 2px;">${t.emoji} ${t.name}</p><div style="height:80px;"><canvas id="ch_${tid}"></canvas></div>`; });
            h += '</div><div class="card"><h3>🕐 Хронология</h3>';
            hist.slice(0, 30).forEach(hi => { let t = ALL_TESTS.find(t => t.id === hi.testId); if (!t) return; let interp = (
                    t.type === 'ch' || !t.sc) ? t.intr(hi.scores.total || Object.values(hi.scores)[0]) : t.intr(hi
                    .scores);
                h +=
                    `<div class="timeline-item"><div class="timeline-date">📅 ${new Date(hi.date).toLocaleString('ru-RU')}</div><strong>${hi.testName}</strong><div style="display:flex;gap:3px;flex-wrap:wrap;margin-top:3px;">${interp.map(i=>`<span class="tag ${i.zn==='r'?'tag-d':'tag-s'}">${i.sc}: ${i.m>0?i.v+'/'+i.m:i.tx}</span>`).join('')}</div></div>`; });
            h += '</div>';
            c.innerHTML = h;
            setTimeout(() => { Object.entries(grp).forEach(([tid, items]) => { if (items.length < 2) return; let t =
                        ALL_TESTS.find(t => t.id === tid); if (!t) return; let canvas = document.getElementById(
                        'ch_' + tid); if (!canvas) return; let sorted = items.sort((a, b) => new Date(a.date) -
                        new Date(b.date)); let mk = t.type === 'ch' || !t.sc ? 'total' : Object.keys(t.sc || {})[
                        0] || 'total';
                    new Chart(canvas, { type: 'line', data: { labels: sorted.map(s => new Date(s.date)
                                .toLocaleDateString('ru-RU')), datasets: [{ data: sorted.map(s => mk ===
                                    'total' ? (s.scores.total || Object.values(s.scores)[0] || 0) : (s
                                    .scores[mk] || 0)), borderColor: '#6366F1',
                                backgroundColor: 'rgba(99,102,241,0.05)', fill: true, tension: 0.3,
                                pointRadius: 2, borderWidth: 1.5 }] }, options: { responsive: true,
                                maintainAspectRatio: false, scales: { x: { ticks: { color: '#64748B',
                                            font: { size: 7 } } }, y: { ticks: { color: '#64748B',
                                        font: { size: 7 } } } }, plugins: { legend: { display: false } } }
                    }); }); }, 400);
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.nav-item').forEach(item => item.addEventListener('click', function() { navTo(this
                    .dataset.screen); }));
            document.getElementById('exitTestBtn').addEventListener('click', () => { curTest = null;
                navTo('home'); });
            document.getElementById('prevBtn').addEventListener('click', prevQuestion);
            document.getElementById('resetAllBtn').addEventListener('click', resetAll);
            navTo('home');
            renderFilters();
            renderTests();
            renderOverdue();
        });
    </script>
</body>
</html>
